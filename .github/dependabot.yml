version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        # Minor and patch only. The group takes every dev dependency into one
        # PR, so a single unadaptable major makes the whole group's CI fail and
        # strands the safe updates inside it - this week typescript 5 -> 7
        # lands in the group, and typescript 7 makes `npm ci` fail to resolve
        # against typescript-eslint 8, so every job in the pipeline is red.
        # Majors now arrive as their own PRs, where the breakage is isolated
        # and reviewable one at a time.
        update-types:
          - minor
          - patch
    ignore:
      # The 22.x line is what both tsconfig and the Node 22 CI matrix target.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /services/engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
